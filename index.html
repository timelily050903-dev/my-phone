<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Phone V14</title>
<style>
/* ================= 1. 기본 스타일 ================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Text","Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:#1b1c20;display:flex;align-items:center;justify-content:center;color:#111}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit}
.phone{position:relative;width:390px;height:844px;max-height:100vh;border-radius:54px;background:#000;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #3a3b40}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:#f2f2f7}
@media (max-width:440px){body{background:#000}.phone{width:100vw;height:100vh;max-height:none;border-radius:0;padding:0;box-shadow:none}.screen{border-radius:0}}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:15px;font-weight:600;z-index:50;pointer-events:none}
.statusbar.light{color:#fff}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:32px;background:#000;border-radius:20px;z-index:60}
.view{position:absolute;inset:0;display:none;flex-direction:column;padding-top:46px;padding-bottom:64px}
.view.active{display:flex}
.scroll{flex:1;overflow-y:auto}

/* ================= 2. 하단 내비게이션 바 ================= */
.navbar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;justify-content:space-around;align-items:center;background:rgba(248,248,250,.85);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.08);z-index:40}
.navbar.dark{background:rgba(20,20,24,.55);border-top-color:rgba(255,255,255,.1);color:#fff}
.navbar button{width:72px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:14px}
.navbar button:active{background:rgba(127,127,127,.2)}
.navbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navbar.hidden{display:none}

/* ================= 3. 잠금 화면 ================= */
#lock{background:linear-gradient(160deg,#1e3c55,#3d2a4f 60%,#0e0f14);color:#fff;align-items:center;padding-bottom:30px}
.lock-time{font-size:78px;font-weight:300;margin-top:30px;letter-spacing:-2px}
.lock-date{font-size:17px;opacity:.85}
.lock-msg{margin-top:34px;font-size:15px;opacity:.9}
.dots{display:flex;gap:16px;margin:18px 0 26px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots span.on{background:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 24px}
.keypad button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);font-size:30px;color:#fff;backdrop-filter:blur(10px)}
.keypad button:active{background:rgba(255,255,255,.4)}
.keypad .blank{background:none}
.keypad .txt{background:none;font-size:16px}

/* ================= 4. 홈 화면 ================= */
#home{background:linear-gradient(170deg,#7aa7c7,#c9a4c4 55%,#f1c9a8)}
.home-title{text-align:center;color:#fff;margin:18px 0 6px;font-size:15px;opacity:.95;text-shadow:0 1px 4px rgba(0,0,0,.25)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;padding:22px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.app .ic{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.18)}
.app:active .ic{filter:brightness(.8)}

/* ================= 5. 공통 앱 UI ================= */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:48px;background:#f2f2f7}
.appbar h1{font-size:30px;font-weight:700}
.appbar h2{font-size:17px;font-weight:600;text-align:center;flex:1}
.link{color:#007aff;font-size:16px}
.link.red{color:#ff3b30}
.list{background:#fff;margin:8px 16px;border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e5e5ea;width:100%;text-align:left}
.row:last-child{border-bottom:none}
.avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(#a0a4ad,#7d818a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.row .name small{font-weight:400;color:#8e8e93;font-size:13px}
.row .prev{color:#8e8e93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:2px 7px;border-radius:8px;background:#e5e5ea;color:#555}
.empty{text-align:center;color:#8e8e93;padding:40px 20px;font-size:14px}
.creator-banner{background:#ff9500;color:#fff;font-size:12px;text-align:center;padding:4px}

/* ================= 6. 메시지(대화방) ================= */
.chat{flex:1;overflow-y:auto;background:#fff;padding:8px 12px 12px}
.daysep{text-align:center;color:#8e8e93;font-size:12px;margin:16px 0 6px;font-weight:500}
.gaptime{text-align:center;color:#8e8e93;font-size:11px;margin:10px 0 4px}
.bub{max-width:74%;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.35;margin:2px 0;word-break:break-word;white-space:pre-wrap;position:relative}
.bub.them{background:#e9e9eb;align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:#007aff;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msgline{display:flex;flex-direction:column}
.bub.editable{outline:2px dashed #ff9500;outline-offset:1px;cursor:pointer}
.composer{display:flex;gap:8px;align-items:flex-end;padding:8px 10px;background:#f7f7f9;border-top:1px solid #e5e5ea}
.composer textarea{flex:1;resize:none;border:1px solid #d1d1d6;border-radius:18px;padding:8px 14px;height:38px;max-height:100px;background:#fff;outline:none}
.send{width:36px;height:36px;border-radius:50%;background:#007aff;color:#fff;font-size:18px;flex:none}

/* ================= 7. 시트(입력창) ================= */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:flex-end}
.sheet-bg.open{display:flex}
.sheet{background:#f2f2f7;width:100%;border-radius:16px 16px 0 0;padding:16px 16px 84px;max-height:88%;overflow-y:auto}
.sheet h3{text-align:center;font-size:17px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#6d6d72;margin:0 0 4px 4px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #d1d1d6;background:#fff;outline:none}
.field textarea{min-height:80px;resize:vertical}
.seg{display:flex;background:#e3e3e8;border-radius:9px;padding:2px}
.seg button{flex:1;padding:7px;border-radius:7px;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:12px;border-radius:12px;background:#007aff;color:#fff;font-weight:600}
.btn.gray{background:#e5e5ea;color:#111}
.btn.red{background:#ff3b30}
.hint{font-size:12px;color:#8e8e93;margin:4px 4px 10px}

/* ================= 8. 갤러리 ================= */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#fff}
.tile{position:relative;aspect-ratio:1;background:#ddd;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.missing{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#666;text-align:center;padding:6px;background:repeating-linear-gradient(45deg,#e8e8ec,#e8e8ec 8px,#dedee3 8px,#dedee3 16px)}
.viewer{position:absolute;inset:0;background:#000;z-index:70;display:none;flex-direction:column;color:#fff;padding:46px 0 64px}
.viewer.open{display:flex}
.viewer .top{display:flex;justify-content:space-between;padding:8px 16px}
.viewer .top .link{color:#4da3ff}
.viewer .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.viewer .img img{max-width:100%;max-height:100%}
.viewer .info{padding:14px 18px 18px;background:#111}
.viewer .info .c{font-size:16px;line-height:1.4}
.viewer .info .m{font-size:12px;color:#aaa;margin-top:6px}

/* ================= 9. 메모 ================= */
.note-body{background:#fff;margin:8px 16px;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.55;font-size:16px;min-height:200px}
.section-title{font-size:13px;color:#6d6d72;margin:16px 30px 4px;text-transform:uppercase}

.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;z-index:90;display:none}

/* ================= 10. 알림 배너 · 전화 · 배지 (V6) ================= */
.avatar{position:relative}
.udot{position:absolute;left:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#007aff;border:2px solid #fff}
.app .ic{position:relative}
.nb{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b30;color:#fff;font:600 12px/20px sans-serif;font-style:normal;text-align:center;text-shadow:none}
.sysmsg{text-align:center;color:#8e8e93;font-size:12px;margin:8px 0}
.banner{position:absolute;left:10px;right:10px;top:50px;z-index:85;background:rgba(250,250,252,.96);border-radius:18px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;text-align:left;animation:drop .3s}
.banner.show{display:block}
.banner b{font-size:14px}.banner div{font-size:14px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.call{position:absolute;inset:0;z-index:100;display:none;flex-direction:column;justify-content:space-between;align-items:center;background:linear-gradient(#2b2f3a,#0e0f14);color:#fff;padding:110px 20px 70px}
.call.open{display:flex}
.call .cn{text-align:center;width:100%}
.call .avatar{width:96px;height:96px;font-size:40px;margin:0 auto 16px}
.call h2{font-size:30px;font-weight:500}.call p{opacity:.7;margin-top:6px}
.clines{margin-top:26px;display:flex;flex-direction:column;gap:8px;align-items:center;max-height:260px;overflow-y:auto}
.clines span{background:rgba(255,255,255,.14);padding:8px 14px;border-radius:16px;font-size:15px;max-width:90%}
.cbtns{display:flex;gap:70px}
.cb{width:72px;height:72px;border-radius:50%;font-size:14px;font-weight:600;color:#fff}
.cb.red{background:#ff3b30}.cb.green{background:#34c759}
.ring .avatar{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* ================= 11. V7: 홈(밝은 배경) / 전화 / 문자 / 캘린더 / 음악 ================= */
#home{background:linear-gradient(170deg,#cfe8ff,#eaf3ff 45%,#ffe8d4);padding-bottom:64px}
#home .app{color:#222;text-shadow:none}
.widget{margin:12px 16px 0;border-radius:20px;background:rgba(255,255,255,.55);backdrop-filter:blur(14px);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:14px 16px}
.widget.clock{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.bigt{font-size:54px;font-weight:300;letter-spacing:-2px;line-height:1}.bigt small{font-size:16px;margin-left:4px;letter-spacing:0}
.dt{font-size:13px;color:#555;margin-top:6px}.wth{text-align:right;font-size:15px;color:#333}.wth small{color:#777}
.widget.wmemo{background:#fff}.widget.wmemo .t{font-size:12px;color:#888;margin-bottom:4px}.widget.wmemo div:last-child{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .apps{padding:18px 10px}
.dock{margin:auto 12px 10px;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 0 6px;border-radius:28px;background:rgba(255,255,255,.5);backdrop-filter:blur(14px)}
.calic{width:100%;height:100%;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;color:#222;text-shadow:none}
.calic b{background:#ff3b30;color:#fff;font-size:11px;padding:2px 0;text-align:center}.calic span{flex:1;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.nb{z-index:2}
/* 전화 통화 화면 */
.call{background:linear-gradient(#3a332f,#1a1512);padding:100px 18px 60px}
.ctop{text-align:center}.ctop h2{font-size:32px;font-weight:400}
.cst{margin-top:8px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:18px;opacity:.85}
.sim{background:rgba(255,255,255,.85);color:#222;font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px}
.cline{width:100%;min-height:110px;text-align:center;padding:0 8px}.cline small{display:block;opacity:.6;margin-bottom:8px;font-size:14px}.cline div{font-size:22px;line-height:1.4}
.cgrid{display:grid;grid-template-columns:repeat(3,76px);gap:22px 34px}
.gb{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:12px}
.gc{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:28px}.gb.on .gc{background:#fff;color:#222}
.cbtns.single{justify-content:center}.cb svg{width:34px;height:34px;fill:#fff}.cb.red svg{transform:rotate(135deg)}
/* 전화 앱 */
.pbody{flex:1;overflow-y:auto;background:#fff}
.dialnum{height:60px;text-align:center;font-size:34px;padding-top:12px}
.dial{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;justify-content:center;margin-top:90px}
.dial button{width:76px;height:76px;border-radius:50%;background:#e9e9ee;display:flex;flex-direction:column;align-items:center;justify-content:center}.dial b{font-size:30px;font-weight:400;line-height:1}.dial small{font-size:10px;letter-spacing:2px;font-weight:600;height:11px}
.dialact{display:grid;grid-template-columns:repeat(3,76px);gap:22px;justify-content:center;margin-top:14px}.dialact button{width:76px;height:76px;border-radius:50%;font-size:22px}
.callgo{background:#34c759;display:flex;align-items:center;justify-content:center}.callgo svg{width:32px;height:32px;fill:#fff}
.ptabs{display:flex;justify-content:space-around;margin:6px 12px 8px;padding:6px;border-radius:30px;background:#f2f2f7;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ptabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;padding:5px 0;border-radius:22px}.ptabs button span{font-size:19px}.ptabs button.on{background:#dfe8f5;color:#007aff}
/* 문자: 청록 헤더 */
#app.teal{background:linear-gradient(#6fc7c4 0,#6fc7c4 98px,#fff 98px)}
#app.green{background:linear-gradient(#1db954 0,#1db954 176px,#f6f6f8 176px)}
.chathead{display:flex;align-items:center;gap:10px;padding:6px 14px 12px;color:#fff;background:#6fc7c4}.chathead h2{flex:1;font-size:20px;font-weight:700;text-align:left}.chathead button{color:#fff;font-size:15px}.chathead .bk{font-size:30px;line-height:1}
.chat{background:#fff}
.grp{display:flex;gap:8px;margin:3px 0;align-items:flex-start}.grp .sp{width:38px;flex:none}.grp .avatar{width:38px;height:38px;flex:none;font-size:14px}.col{display:flex;flex-direction:column;align-items:flex-start;max-width:76%}.nm{font-weight:700;font-size:14px;margin:6px 0 3px}
.bub{font-weight:600;border-radius:14px}.bub.them{background:#f1f1f1;color:#111;border-top-left-radius:4px}.bub.me{background:#7fcfcc;color:#fff;border-bottom-right-radius:4px}.grp .bub{max-width:100%}
.composer{background:#fff;border-top:none;padding:8px 10px}.composer textarea{border-radius:4px;border:1px solid #ddd;height:40px}.composer .send{width:62px;height:40px;border-radius:4px;background:#7fcfcc;font-size:15px;font-weight:600}
.avatar{overflow:visible}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
/* 캘린더 */
.cal{background:#fff;margin:8px 12px;border-radius:14px;padding:10px}.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.wk span{font-size:12px;color:#888;padding:6px 0}
.cd{position:relative;height:44px;font-size:15px}.cd.sun,.wk .sun{color:#ff3b30}.cd.sat,.wk .sat{color:#007aff}
.cd.today{color:#fff!important;font-weight:700;background:radial-gradient(circle,#ff3b30 18px,transparent 19px)}.cd.sel{outline:2px solid #007aff;outline-offset:-4px;border-radius:12px}.cd u{position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#888}
/* 음악 */
.mhead{text-align:center;color:#fff;padding:4px 16px 14px}.mhead .t{display:flex;justify-content:space-between;font-size:20px;font-weight:700;text-align:left}.mhead h2{font-size:22px;margin-top:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard{background:#fff;margin:14px 16px;border-radius:22px;padding:16px 16px 6px;box-shadow:0 2px 10px rgba(0,0,0,.06)}.mcard h3{font-size:18px}.mcard>p{color:#777;font-size:13px;margin-bottom:6px}
.trk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid #eee}.trk .ti{width:46px;height:46px;border-radius:10px;background:linear-gradient(#5fbf8a,#2e9a63);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.trk .m{flex:1;min-width:0}.trk .tt{font-weight:700;font-size:15px}.trk .tt.on{color:#16a34a}.trk small{color:#777;font-size:12px}.trk .pl{font-size:18px}


/* ================= 12. V8: 하단바 중앙 / 전화 상단 탭 / 다크 모드 / 선택지 ================= */
.navbar{justify-content:center;gap:40px}
.ptop{display:flex;margin:8px 16px 4px;background:#e3e3e8;border-radius:10px;padding:2px}
.ptop button{flex:1;padding:8px 0;border-radius:8px;font-size:14px}
.ptop button.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dial{margin-top:30px}
.choices{display:flex;flex-wrap:wrap;gap:8px;padding:8px 10px;background:#fff;border-top:1px solid #eee}
.chip{padding:8px 14px;border-radius:18px;border:1.5px solid #7fcfcc;color:#2a9d99;background:#fff;font-size:14px;font-weight:600;text-align:left}
.chip:active{background:#e6f7f6}
.chip.editable{outline:2px dashed #ff9500;outline-offset:1px}
.chip.add{border:1.5px dashed #ff9500;color:#ff9500}
#home{background:linear-gradient(170deg,#ffffff,#f1f5fb 60%,#e8edf5)}

body.dark{color:#fff}
body.dark .screen{background:#000}
body.dark .statusbar{color:#fff}
body.dark #home{background:linear-gradient(170deg,#000,#16171c)}
body.dark #home .app{color:#fff}
body.dark .widget{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
body.dark .dt,body.dark .wth,body.dark .wth small{color:#bbb}
body.dark .widget.wmemo{background:#1c1c1e}
body.dark .widget.wmemo .t{color:#999}
body.dark .dock{background:rgba(255,255,255,.12)}
body.dark .appbar{background:#000;color:#fff}
body.dark .list,body.dark .cal,body.dark .mcard,body.dark .note-body{background:#1c1c1e;color:#fff}
body.dark .row{border-bottom-color:#2c2c2e}
body.dark .row .prev,body.dark .row .name small,body.dark .empty,body.dark .section-title,body.dark .hint,body.dark .wk span,body.dark .mcard>p,body.dark .trk small{color:#8e8e93}
body.dark .pbody{background:#000}
body.dark .ptop{background:#2c2c2e}body.dark .ptop button.on{background:#48484a}
body.dark .dial button{background:#2c2c2e;color:#fff}
body.dark .dialact button:not(.callgo){background:none;color:#fff}
body.dark .navbar{background:rgba(20,20,24,.9);border-top-color:rgba(255,255,255,.1);color:#fff}

/* =====================================================================
   [저장 구조] 제작자 데이터와 이용자 데이터를 서로 다른 키에 저장
   ===================================================================== */
const MODE_KEY = "cp10_mode", CM_KEY = "cp10_cm";
let mode = "light";
try { if(localStorage.getItem(MODE_KEY) === "dark") mode = "dark"; } catch(e){}
let KEY_CREATOR = "", KEY_USER = "", creator = null, user = null;

const clone = o => JSON.parse(JSON.stringify(o));
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const userDefaults = () => ({ contacts: [], messages: {}, renamed: {}, gallery: [], captions: {}, notes: [], ownerName: null, passcode: null, creatorMode: false, liked: {}, scomments: {}, seen: {}, ccomments: {}, webq: [], alarms: [], alarmOff: {}, alarmOn: {}, theme: "light", used: [], cal: [], unread: {}, fired: [], sound: true, missed: 0 });
function normCreator(c){
  c.calendar = c.calendar || []; c.sns = c.sns || { accounts: [], ownerId: "", posts: [], stories: [] }; c.web = c.web || { bookmarks: [], history: [], pages: [] };
  c.campus = c.campus || { name: "어장대타임", boards: [], posts: [] }; c.music = c.music || []; c.alarms = c.alarms || []; c.events = c.events || []; c.autoReplies = c.autoReplies || [];
  c.contacts = c.contacts || []; c.gallery = c.gallery || []; c.notes = c.notes || []; c.appIcons = c.appIcons || {}; c.phoneDate = c.phoneDate || "2020-08-02";
  return c;
}
// 라이트 / 다크는 서로 다른 휴대폰: 제작자·이용자 데이터를 각각 따로 저장
// 제작자가 넣은 unread:true 문자 / missed:true 부재중 전화를 처음 켰을 때 알림으로 쌓아 둠
function seedBacklog(){
  if(user.seeded) return;
  user.unread = user.unread || {}; let miss = 0;
  creator.contacts.forEach(c => (c.messages || []).forEach(m => {
    if(m.unread) user.unread[c.id] = (user.unread[c.id] || 0) + 1;
    if(m.missed) miss++;
  }));
  user.missed = (user.missed || 0) + miss; user.seeded = true;
  try { localStorage.setItem(KEY_USER, JSON.stringify(user)); } catch(e){}
}
function loadMode(){
  KEY_CREATOR = "cp10_creator_" + mode; KEY_USER = "cp10_user_" + mode;
  creator = normCreator(load(KEY_CREATOR, null) || clone(mode === "dark" ? CREATOR_DARK : CREATOR));
  user = Object.assign(userDefaults(), load(KEY_USER, {}));
  user.theme = mode;
  seedBacklog();
  try { user.creatorMode = localStorage.getItem(CM_KEY) === "1"; } catch(e){}
}
loadMode();
const saveCreator = () => { try { localStorage.setItem(KEY_CREATOR, JSON.stringify(creator)); } catch(e){ toast("저장 공간이 부족합니다 (사진은 images 폴더 경로를 쓰세요)"); } };
const saveUser = () => { try { localStorage.setItem(KEY_USER, JSON.stringify(user)); } catch(e){ toast("저장 공간이 부족합니다"); } };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const $ = id => document.getElementById(id);
const ownerName = () => user.ownerName || creator.ownerName;
const passcode = () => user.passcode || creator.passcode;
const isCreator = () => !!user.creatorMode;

/* ================= 날짜/시간 도우미 ================= */
const pad = n => String(n).padStart(2, "0");
// 이 휴대폰 속 날짜는 creator.phoneDate 로 고정, 시각만 실제 시계를 따라감
function vDate(){ const d = new Date(), p = String((creator && creator.phoneDate) || "").split("-").map(Number); if(p.length === 3 && p[0]) d.setFullYear(p[0], p[1] - 1, p[2]); return d; }
const todayStr = () => { const d = vDate(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function fmtTime(t){ if(!t) return ""; let [h,m] = t.split(":").map(Number); const ap = h < 12 ? "오전" : "오후"; h = h % 12 || 12; return `${ap} ${h}:${pad(m)}`; }
function fmtDay(ds){
  if(!ds) return "";
  const t = todayStr(); const y = vDate(); y.setDate(y.getDate()-1);
  const ys = `${y.getFullYear()}-${pad(y.getMonth()+1)}-${pad(y.getDate())}`;
  if(ds === t) return "오늘"; if(ds === ys) return "어제";
  const [Y,M,D] = ds.split("-").map(Number); const w = "일월화수목금토"[new Date(Y,M-1,D).getDay()];
  return `${Y}년 ${M}월 ${D}일 (${w})`;
}
function shortDay(ds){ if(!ds) return ""; const t=todayStr(); if(ds===t) return ""; const f=fmtDay(ds); return f==="어제"?f:ds.replace(/-/g,". "); }
const stamp = m => m.date ? new Date(`${m.date}T${m.time || "00:00"}`).getTime() : -Infinity;
// 날짜/시간 순 정렬. 날짜가 없는 기록은 임의 날짜를 만들지 않고 맨 앞(입력 순서대로)에 둔다.
const sortMsgs = arr => arr.map((m,i)=>({m,i})).sort((a,b)=> (stamp(a.m)-stamp(b.m)) || (a.i-b.i)).map(x=>x.m);

/* ================= 데이터 조회 ================= */
function allContacts(){
  const list = creator.contacts.map(c => ({ ...c, src: "creator", name: user.renamed[c.id] || c.name }));
  user.contacts.forEach(c => list.push({ ...c, src: "user", messages: [] }));
  return list;
}
function avHtml(c, cls = "", extra = ""){ return `<div class="avatar ${cls}">${esc((c.name || "?").slice(0,1))}${c.avatar ? `<img src="${esc(c.avatar)}" alt="" onerror="this.remove()">` : ""}${extra}</div>`; }
function getContact(id){ return allContacts().find(c => c.id === id); }
function messagesOf(id){
  const c = creator.contacts.find(x => x.id === id);
  const base = c ? c.messages.map(m => ({ ...m, src: "creator" })) : [];
  const mine = (user.messages[id] || []).map(m => ({ ...m, src: "user" }));
  return sortMsgs(base.concat(mine));
}

/* =====================================================================
   [화면 이동] 기록 스택 — 되돌아가기/홈 버튼
   ===================================================================== */
let stack = [];      // 지난 화면들
let current = null;  // { name, arg }
function go(name, arg, push = true){
  if(push && current) stack.push(current);
  current = { name, arg };
  render();
}
function back(){
  if($("viewer").classList.contains("open")){ closeViewer(); return; }
  if($("sheetBg").classList.contains("open")){ closeSheet(); return; }
  if(stack.length){ current = stack.pop(); render(); }
  else if(current && current.name !== "home"){ current = { name: "home" }; render(); }
}
function goHome(){ closeViewer(); closeSheet(); stack = []; current = { name: "home" }; render(); }
$("navBack").onclick = back;
$("navHome").onclick = goHome;
$("navMenu").onclick = () => {}; // 요청대로 메뉴 버튼은 표시만 함(기능 없음)

const EXTRA = {};   // 새 앱 화면은 EXTRA.앱id = 함수 로 등록
function render(){
  applyTheme();
  ["lock","home","app"].forEach(v => $(v).classList.remove("active"));
  const n = current.name;
  $("navbar").classList.toggle("hidden", n === "lock");
  $("navbar").classList.toggle("dark", false);
  $("statusbar").classList.toggle("light", n === "lock" || n === "chat" || n === "music");
  $("app").classList.toggle("teal", n === "chat"); $("app").classList.toggle("green", n === "music");
  if(n === "lock"){ $("lock").classList.add("active"); renderLock(); return; }
  if(n === "home"){ $("home").classList.add("active"); renderHome(); return; }
  $("app").classList.add("active");
  const R = { events: renderEvents, phone: renderPhone, calendar: renderCalendar, music: renderMusic, msgList: renderMsgList, chat: renderChat, gallery: renderGallery, notes: renderNotes, note: renderNote, settings: renderSettings }[n] || EXTRA[n];
  $("app").innerHTML = (isCreator() ? `<div class="creator-banner">제작자 모드 — 편집 내용은 '내보내기'로 코드에 반영하세요</div>` : "");
  R(current.arg);
}

/* ================= 시계 ================= */
function tick(){
  const d = vDate(); const t = `${d.getHours()}:${pad(d.getMinutes())}`;
  $("sbTime").textContent = t; $("lockTime").textContent = t;
  $("lockDate").textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
  if($("hTime")){ const h = d.getHours(); $("hTime").innerHTML = `${h % 12 || 12}:${pad(d.getMinutes())}<small>${h < 12 ? "오전" : "오후"}</small>`; $("hDate").textContent = $("lockDate").textContent; }
}
setInterval(tick, 10000); tick();

/* =====================================================================
   [잠금 화면]
   ===================================================================== */
let entered = "", lockStage = 0;
function fillLockNotes(){
  $("lockNotes").innerHTML = Object.keys(user.unread).filter(id => user.unread[id] && getContact(id)).map(id => { const m = messagesOf(id).filter(x => x.from !== "me" && x.from !== "sys").slice(-1)[0]; return m ? `<div class="lknote"><b>${esc(getContact(id).name)}</b><div>${esc(m.text)}</div></div>` : ""; }).join("");
}
function renderLock(){
  $("lock").classList.toggle("stage0", lockStage === 0); fillLockNotes();
  $("lock").onclick = () => { if(lockStage === 0){ lockStage = 1; renderLock(); } };
  entered = ""; drawDots();
  $("lockMsg").textContent = "암호 입력";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  $("keypad").innerHTML = keys.map(k => k === "" ? `<button class="blank" disabled></button>` : k === "⌫" ? `<button class="txt" data-k="del">삭제</button>` : `<button data-k="${k}">${k}</button>`).join("");
  $("keypad").querySelectorAll("button[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
}
function drawDots(){ const len = passcode().length; $("dots").innerHTML = Array.from({length:len},(_,i)=>`<span class="${i<entered.length?"on":""}"></span>`).join(""); }
function press(k){
  if(k === "del"){ entered = entered.slice(0,-1); drawDots(); return; }
  entered += k; drawDots();
  if(entered.length >= passcode().length){
    if(true){ /* 아무 번호나 맞게 처리 */ setTimeout(() => { lockStage = 0; stack = []; current = null; go("home", null, false); }, 150); }
    else { $("dots").classList.add("shake"); $("lockMsg").textContent = "암호가 틀렸습니다"; setTimeout(() => { $("dots").classList.remove("shake"); entered = ""; drawDots(); }, 450); }
  }
}

/* =====================================================================

   ===================================================================== */
function renderMsgList(){
  const list = allContacts().map(c => ({ c, last: messagesOf(c.id).slice(-1)[0] }))
    .sort((a,b) => (b.last ? stamp(b.last) : -1e15) - (a.last ? stamp(a.last) : -1e15));
  $("app").insertAdjacentHTML("beforeend", `
    <div class="appbar"><span></span><button class="link" id="addContact">새 대화 상대</button></div>
    <div class="appbar" style="padding-top:0"><h1>메시지</h1></div>
    <div class="scroll"><div class="list">${list.map(({c,last}) => `
      <button class="row" data-id="${c.id}">
        ${avHtml(c, "", user.unread[c.id] ? `<i class="udot"></i>` : "")}
        <div class="main"><div class="name"><span>${esc(c.name)}</span><small>${last ? esc(shortDay(last.date) || fmtTime(last.time)) : ""}</small></div>
        <div class="prev">${last ? esc(last.text) : "메시지 없음"}</div></div>
      </button>`).join("") || `<div class="empty">대화가 없습니다</div>`}</div></div>`);
  $("app").querySelectorAll(".row").forEach(r => r.onclick = () => go("chat", r.dataset.id));
  $("addContact").onclick = () => openSheet(`
    <h3>새 대화 상대</h3>
    <div class="field"><label>이름</label><input id="fName" placeholder="이름"></div>
    ${isCreator() ? `<p class="hint">제작자 모드: 모든 방문자에게 보이는 기본 대화 상대로 추가됩니다.</p>` : ""}
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">추가</button></div>`, () => {
      $("fSave").onclick = () => {
        const name = $("fName").value.trim(); if(!name) return;
        if(isCreator()){ creator.contacts.push({ id: uid("c_"), name, messages: [] }); saveCreator(); }
        else { user.contacts.push({ id: uid("u_"), name }); saveUser(); }
        closeSheet(); render();
      };
    });
}

/* =====================================================================
   [메시지 앱] 대화방 — 날짜 구분선 + 최소한의 시간 표시
   ===================================================================== */
const GAP_MIN = 60; // 같은 날 이 시간(분) 이상 끊긴 곳에만 시간 표시
function renderChat(id){
  const c = getContact(id); if(!c){ goHome(); return; }
  if(user.unread[id]){ delete user.unread[id]; saveUser(); }
  const msgs = messagesOf(id);
  let html = "", prevDay = null, prevStamp = null, prevFrom = null;
  msgs.forEach(m => {
    if(m.date && m.date !== prevDay){
      html += `<div class="daysep">${esc(fmtDay(m.date))}${m.time ? " " + fmtTime(m.time) : ""}</div>`;
    } else if(m.date && m.time && prevStamp !== null && stamp(m) - prevStamp >= GAP_MIN * 60000){
      html += `<div class="gaptime">${fmtTime(m.time)}</div>`;
    }
    const canEdit = isCreator() ? m.src === "creator" : m.src === "user";
    if(m.from === "sys"){ prevFrom = "sys"; html += `<div class="sysmsg">${esc(m.text)}</div>`; if(m.date){ prevDay = m.date; } return; }
    const cls = `bub ${m.from === "me" ? "me" : "them"} ${isCreator() && canEdit ? "editable" : ""}`, at = `data-mid="${m.id}" data-src="${m.src}"`;
    if(m.from === "me") html += `<div class="msgline"><div class="${cls}" ${at}>${esc(m.text)}</div></div>`;
    else { const first = prevFrom !== "them" || m.date !== prevDay;
      html += `<div class="grp">${first ? avHtml(c) : `<div class="sp"></div>`}<div class="col">${first ? `<div class="nm">${esc(c.name)}</div>` : ""}<div class="${cls}" ${at}>${esc(m.text)}</div></div></div>`; }
    prevFrom = m.from;
    if(m.date){ prevDay = m.date; prevStamp = m.time ? stamp(m) : prevStamp; }
  });
  $("app").insertAdjacentHTML("beforeend", `
    <div class="chathead">
      <button class="bk" id="chatBack">‹</button>
      <h2>${esc(c.name)}</h2>
      <button id="chatEdit">${isCreator() ? "기록 추가" : "편집"}</button>
    </div>
    <div class="chat" id="chatBox">${html || `<div class="empty">아직 대화가 없습니다</div>`}</div>
    ${choiceStrip(c)}${c.choicesOnly ? "" : `<div class="composer"><textarea id="msgIn"></textarea><button class="send" id="sendBtn">전송</button></div>`}`);
  const box = $("chatBox"); box.scrollTop = box.scrollHeight;
  $("chatBack").onclick = back;
  $("app").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    if(b.dataset.add){ choiceSheet(id); return; }
    const ch = (c.choices || []).find(x => x.id === b.dataset.cid);
    if(isCreator()) choiceSheet(id, ch); else useChoice(id, ch);
  });
  $("chatEdit").onclick = () => isCreator() ? openRecordSheet(id) : openContactSheet(id);
  const send = () => {
    const t = $("msgIn").value.trim(); if(!t) return;
    (user.messages[id] = user.messages[id] || []).push({ id: uid("um"), from: "me", date: todayStr(), time: nowTime(), text: t });
    saveUser(); render(); autoReply(id, t);
  };
  if($("sendBtn")){ $("sendBtn").onclick = send;
    $("msgIn").onkeydown = e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } }; }
  if(isCreator()) box.querySelectorAll(".bub.editable").forEach(b => b.onclick = () => openRecordSheet(id, b.dataset.mid));
}

// 대화 상대 이름 수정 / 삭제 (이용자)
function openContactSheet(id){
  const c = getContact(id);
  openSheet(`
    <h3>대화 상대 편집</h3>
    <div class="field"><label>이름</label><input id="fName" value="${esc(c.name)}"></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>
    ${(user.messages[id]||[]).length ? `<div class="btns"><button class="btn gray" id="fClear">내가 보낸 새 문자 지우기</button></div>` : ""}
    ${c.src === "user" ? `<div class="btns"><button class="btn red" id="fDel">대화 상대 삭제</button></div>` : ""}`, () => {
    $("fSave").onclick = () => {
      const n = $("fName").value.trim(); if(!n) return;
      if(c.src === "user") user.contacts.find(x => x.id === id).name = n; else user.renamed[id] = n;
      saveUser(); closeSheet(); render();
    };
    if($("fClear")) $("fClear").onclick = () => { if(confirm("이 대화방에서 보낸 새 문자를 지울까요?")){ delete user.messages[id]; saveUser(); closeSheet(); render(); } };
    if($("fDel")) $("fDel").onclick = () => { if(confirm("삭제할까요?")){ user.contacts = user.contacts.filter(x => x.id !== id); delete user.messages[id]; saveUser(); closeSheet(); back(); } };
  });
}

const IMGC = {};   // 사진 id -> 화면용 임시 주소
const IMG_RE = /(src=["']|url\(["']?)idb:(i_[A-Za-z0-9_-]+)/g;
const resolveImg = h => (typeof h === "string" && h.indexOf("idb:i_") >= 0) ? h.replace(IMG_RE, (m, pre, id) => pre + (IMGC[id] || "")) : h;
const imgUrl = x => { const m = /^idb:(i_[A-Za-z0-9_-]+)$/.exec(x || ""); return m ? (IMGC[m[1]] || "") : x; };
(() => { const d = Object.getOwnPropertyDescriptor(Element.prototype, "innerHTML");
  Object.defineProperty(Element.prototype, "innerHTML", { get: d.get, set(v){ d.set.call(this, resolveImg(v)); }, configurable: true });
  const ia = Element.prototype.insertAdjacentHTML; Element.prototype.insertAdjacentHTML = function(pos, h){ return ia.call(this, pos, resolveImg(h)); }; })();
async function preloadImgs(){
  const ids = new Set(); (JSON.stringify(creator) + JSON.stringify(user)).replace(/idb:(i_[A-Za-z0-9_-]+)/g, (m, id) => { ids.add(id); return m; });
  let n = 0; for(const id of ids){ if(IMGC[id]) continue; try{ const b = await idbGet(id); if(b){ IMGC[id] = URL.createObjectURL(b); n++; } }catch(e){} }
  return n;
}
function shrink(data, cb, sz){ const im = new Image(); im.onload = () => { const k = Math.min(1, (sz || 1080) / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  c.toBlob(async blob => { try{ const id = "i_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); await idbPut(id, blob); IMGC[id] = URL.createObjectURL(blob); cb("idb:" + id); }catch(e){ cb(c.toDataURL("image/jpeg", .8)); } }, "image/jpeg", .85); }; im.src = data; }

/* =====================================================================
   [V6] 소리 / 알림 / 예약 이벤트 / 전화 / 키워드 자동응답
   소리는 파일 없이 브라우저가 직접 만듭니다(WebAudio).
   ===================================================================== */
let ac = null, outG = null;
const SND_DEF = { vol: 80, touch: "ting", msg: "ding", ring: "auto", vib: true };
const snd = () => Object.assign({}, SND_DEF, (user && user.snd) || {});
const outNode = () => { if(!outG){ outG = ac.createGain(); outG.connect(ac.destination); } outG.gain.value = snd().vol / 100; return outG; };
const vibe = p => { if(user.sound && snd().vib && navigator.vibrate) navigator.vibrate(p); };
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state === "suspended") ac.resume();
  return ac;
}
document.addEventListener("pointerdown", audio); // 첫 터치 때 소리 사용 허용
function tone(f, t0, d, vol = .2, type = "sine"){
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
  o.type = type; o.frequency.value = f; o.connect(g); g.connect(outNode());
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.start(t); o.stop(t + d + .05);
}
function glassBreak(){
  if(!(user.sound && audio())) return;
  const t0 = ac.currentTime, sr = ac.sampleRate, dur = 2.1;
  const buf = ac.createBuffer(1, Math.floor(sr * dur), sr), d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const nz = (at, len, f, q, vol) => { const s = ac.createBufferSource(); s.buffer = buf; const bp = ac.createBiquadFilter(), g = ac.createGain();
    bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q; s.connect(bp); bp.connect(g); g.connect(outNode());
    g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + .004); g.gain.exponentialRampToValueAtTime(.001, t0 + at + len); s.start(t0 + at, Math.random()); s.stop(t0 + at + len + .05); };
  nz(0, .35, 1800, .6, .9);  nz(0, .2, 5200, .8, .6);  nz(.03, .5, 900, .5, .5);   // 첫 충격음
  for(let i = 0; i < 38; i++){ const at = .05 + Math.pow(Math.random(), 1.6) * 1.8, f = 2500 + Math.random() * 7000;  // 파편 튕기는 소리
    nz(at, .03 + Math.random() * .09, f, 6 + Math.random() * 10, .08 + Math.random() * .22 * (1 - at / 2));
    if(Math.random() < .6) tone(f * (.8 + Math.random() * .4), at, .08 + Math.random() * .12, .03 + Math.random() * .05, "triangle"); }
  navigator.vibrate && navigator.vibrate([60, 30, 40, 30, 90]);
}
function ding(){
  if(user.sound && audio()){
    const k = snd().msg;
    if(k === "ding"){ tone(1318, 0, .25); tone(1760, .16, .5); }
    else if(k === "chime"){ [[523,0],[659,.14],[784,.28],[1047,.42]].forEach(([f,t]) => tone(f, t, .35, .18, "triangle")); }
    else if(k === "bubble"){ const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime; o.type = "sine"; o.frequency.setValueAtTime(380, n); o.frequency.exponentialRampToValueAtTime(1100, n + .12); g.gain.setValueAtTime(.3, n); g.gain.exponentialRampToValueAtTime(.001, n + .22); o.connect(g); g.connect(outNode()); o.start(n); o.stop(n + .25); }
    else if(k === "knock"){ [0, .18].forEach(t => tone(180, t, .12, .5, "sine")); }
  }
  if(snd().msg !== "off") vibe(120);
} // 띠롱
let ringT = null;
function ringStart(){
  ringStop();
  const kind = snd().ring === "auto" ? (mode === "dark" ? "tense" : "basic") : snd().ring, dark = kind === "tense";
  const r = () => {
    if(user.sound && audio() && kind !== "off"){
      if(kind === "classic"){ for(let b = 0; b < 2; b++) for(let i = 0; i < 16; i++) tone(i % 2 ? 1250 : 1500, b * 1.0 + i * .045, .045, .12, "square"); }
      else if(kind === "marimba"){ [[659,0],[784,.15],[988,.3],[784,.45],[659,.6],[988,.75],[1319,.9]].forEach(([f,t]) => tone(f, t, .3, .25, "sine")); }
      else if(dark){ // 긴장감: 낮은 불협화음(트라이톤) + 심장 박동 + 날카로운 고음 틱
        const t0 = 0;
        [[98,0],[138.6,0]].forEach(([f,t]) => { const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain(), n = ac.currentTime + t;
          o.type = "sawtooth"; o.frequency.setValueAtTime(f, n); o.frequency.linearRampToValueAtTime(f * .94, n + 2.2); l.frequency.value = 7; lg.gain.value = .05; l.connect(lg); lg.connect(g.gain);
          const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 520; o.connect(lp); lp.connect(g); g.connect(outNode());
          g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.16, n + .5); g.gain.linearRampToValueAtTime(.18, n + 1.8); g.gain.linearRampToValueAtTime(0, n + 2.3); o.start(n); l.start(n); o.stop(n + 2.4); l.stop(n + 2.4); });
        [0, .38, 1.2, 1.58].forEach(t => { tone(55, t, .28, .5, "sine"); });                 // 쿵-쿵 심장 박동
        [1.0, 1.15, 1.3, 1.45].forEach((t, k) => tone(2349 + k * 31, t, .06, .07, "square")); // 날카로운 틱
      } else { [0, 1.0].forEach(b => [[740,0],[988,.17],[740,.34],[988,.51]].forEach(([f,t]) => tone(f, b + t, .15, .22, "triangle"))); }
    }
    vibe(dark ? [150, 100, 150, 600, 400] : [400, 200, 400]);
  };
  r(); ringT = setInterval(r, dark ? 2800 : 2600);
}
// 내가 전화를 걸 때 들리는 연결음 "뚜루루루…" (1초 울리고 2초 쉼)
function ringbackStart(){
  ringStop();
  const r = () => {
    if(!(user.sound && audio())) return;
    const n = ac.currentTime, g = ac.createGain(), lf = ac.createOscillator(), lg = ac.createGain();
    g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.14, n + .03); g.gain.setValueAtTime(.14, n + .95); g.gain.linearRampToValueAtTime(0, n + 1.0); g.connect(outNode());
    lf.frequency.value = 16; lg.gain.value = .07; lf.connect(lg); lg.connect(g.gain);
    [440, 480].forEach(f => { const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f; o.connect(g); o.start(n); o.stop(n + 1.05); });
    lf.start(n); lf.stop(n + 1.05);
  };
  r(); ringT = setInterval(r, 3000);
}
function ringStop(){ clearInterval(ringT); ringT = null; navigator.vibrate && navigator.vibrate(0); }

function answerCall(){
  const a = callActive; if(!a) return; ringStop(); clearTimeout(a.t); a.state = "talk"; drawCall();
  const last = a.lines.length;
  a.i = setInterval(() => {
    a.sec++; const st = $("cStat"); if(st) st.textContent = `${pad(Math.floor(a.sec/60))}:${pad(a.sec%60)}`;
    const n = Math.floor((a.sec - 1) / 3);                       // 3초마다 한 줄(한 줄씩 교체)
    if(a.sec % 3 === 1 && n < last){ a.cur = a.lines[n]; const l = $("cLine"); if(l) l.innerHTML = `<small>${esc(a.label)}</small><div>${esc(a.cur)}</div>`; }
    if(last && a.sec >= last * 3 + 3) endCall("finished");      // 대사를 모두 끝내면 상대가 끊음
  }, 1000);
}
function endCall(kind, silent){
  const a = callActive; if(!a) return;
  ringStop(); clearTimeout(a.t); clearInterval(a.i); callActive = null; $("call").classList.remove("open");
  let title = "";

  else if(kind === "declined"){ sysLog(a.cid, "거절한 전화", false); title = "전화가 거절됨"; }
  else if(kind === "noanswer"){ sysLog(a.cid, "발신 통화 (받지 않음)", false); title = "전화를 받지 않음"; }

}

const aud = new Audio(); let curTrack = null, curUrl = null;
const fmtSec = x => `${Math.floor(x / 60)}:${pad(Math.floor(x % 60))}`;
// 업로드한 음원은 IndexedDB 에 저장 (localStorage 는 용량이 작아서)
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("cp9", 1); r.onupgradeneeded = () => r.result.createObjectStore("files"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbPut = (k, v) => idb().then(d => new Promise((res, rej) => { const t = d.transaction("files", "readwrite"); t.objectStore("files").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }));
const idbGet = k => idb().then(d => new Promise((res, rej) => { const q = d.transaction("files").objectStore("files").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
async function trackUrl(t){ if(!/^idb:/.test(t.src)) return t.src; const f = await idbGet(t.src.slice(4)); if(!f) throw new Error("none"); if(curUrl) URL.revokeObjectURL(curUrl); return curUrl = URL.createObjectURL(f); }
const refreshMusic = () => { if(current && current.name === "music") render(); };
function nextTrack(d){ const l = creator.music, i = l.findIndex(x => x.id === curTrack), n = l[i + d]; if(n) playTrack(n, true); else { curTrack = null; refreshMusic(); } }
async function playTrack(t, force){
  if(curTrack === t.id && !force){ aud.paused ? aud.play() : aud.pause(); return; }
  try{ aud.src = await trackUrl(t); curTrack = t.id; await aud.play(); }catch(e){ toast("음원 파일을 찾을 수 없습니다"); curTrack = null; }
  refreshMusic();
}
aud.onended = () => nextTrack(1); aud.onplay = refreshMusic; aud.onpause = refreshMusic;
aud.ontimeupdate = () => { const sk = $("mSeek"); if(sk && aud.duration){ sk.max = aud.duration; sk.value = aud.currentTime; } const tm = $("mTime"); if(tm) tm.textContent = `${fmtSec(aud.currentTime || 0)} / ${fmtSec(aud.duration || 0)}`; };
function renderMusic(){
  const l = creator.music, cur = l.find(t => t.id === curTrack), playing = cur && !aud.paused;
  $("app").insertAdjacentHTML("beforeend", `
    <div class="mhead"><div class="t"><span>음악</span>${isCreator() ? `<button id="mAdd" style="color:#fff;font-size:15px">곡 추가</button>` : ""}</div><h2>${esc(cur ? cur.title : "지금 듣는 음악")}</h2></div>
    <div class="scroll">
      ${cur ? `<div class="mcard mplay"><input type="range" id="mSeek" min="0" max="${aud.duration || 0}" step="0.1" value="${aud.currentTime || 0}" style="width:100%"><div class="mctl"><small id="mTime">${fmtSec(aud.currentTime || 0)} / ${fmtSec(aud.duration || 0)}</small><button id="mPrev">⏮</button><button id="mPP">${playing ? "⏸" : "▶"}</button><button id="mNext">⏭</button></div></div>` : ""}
      <div class="mcard"><h3>내 플레이리스트</h3><p>자주 듣는 곡</p>
      ${l.map(t => `<button class="trk" data-id="${t.id}"><span class="ti">♪</span><span class="m"><div class="tt ${t.id === curTrack ? "on" : ""}">${esc(t.title)}</div><small>${esc(t.artist || "")}</small></span>${isCreator() ? `<span class="pl" data-e="${t.id}">✎</span>` : ""}<span class="pl">${t.id === curTrack && !aud.paused ? "⏸" : "▶"}</span></button>`).join("") || `<div class="empty">곡이 없습니다</div>`}</div></div>`);
  $("app").querySelectorAll(".trk").forEach(b => b.onclick = e => { const t = l.find(x => x.id === b.dataset.id); if(e.target.dataset.e) musicSheet(t); else playTrack(t); });
  if($("mAdd")) $("mAdd").onclick = () => musicSheet();
  if(cur){ $("mSeek").oninput = e => { aud.currentTime = +e.target.value; }; $("mPP").onclick = () => aud.paused ? aud.play() : aud.pause(); $("mPrev").onclick = () => nextTrack(-1); $("mNext").onclick = () => nextTrack(1); }
}
function musicSheet(t){
  const tid = t ? t.id : uid("s"); let file = null; const stored = t && /^idb:/.test(t.src);
  openSheet(`<h3>${t ? "곡 편집" : "곡 추가"}</h3>
    <div class="field"><label>제목</label><input id="fT" value="${esc(t?.title || "")}"></div>
    <div class="field"><label>가수</label><input id="fA" value="${esc(t?.artist || "")}"></div>
    <div class="field"><label>음원 파일 경로 (예: music/song3.mp3)</label><input id="fS" value="${esc(stored ? "" : (t ? t.src : "music/"))}"></div>
    <div class="field"><label>또는 음원 파일 선택 (이 브라우저에만 저장 · 미리 듣기용)</label><input type="file" accept="audio/*" id="fF"></div>
    ${stored ? `<p class="hint">지금은 이 브라우저에 저장된 음원을 사용 중입니다.</p>` : ""}
    <p class="hint">모든 방문자에게 들려주려면 음원 파일을 HTML 파일 옆 <b>music</b> 폴더에 넣고 위 경로 칸에 적으세요.</p>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>${t ? `<div class="btns"><button class="btn red" id="fDel">삭제</button></div>` : ""}`, () => {
    $("fF").onchange = e => { file = e.target.files[0]; if(file && !$("fT").value.trim()) $("fT").value = file.name.replace(/\.[^.]+$/, ""); };
    $("fSave").onclick = async () => {
      const d = { title: $("fT").value.trim(), artist: $("fA").value.trim() };
      try{ if(file){ await idbPut(tid, file); d.src = "idb:" + tid; } else d.src = $("fS").value.trim() || (stored ? t.src : ""); }catch(e){ toast("음원을 저장하지 못했습니다"); return; }
      if(!d.title || !d.src){ toast("제목과 음원을 입력하세요"); return; }
      if(t) Object.assign(t, d); else creator.music.push({ id: tid, ...d }); saveCreator(); closeSheet(); render();
    };
    if($("fDel")) $("fDel").onclick = () => { if(curTrack === t.id){ aud.pause(); curTrack = null; } creator.music = creator.music.filter(x => x.id !== t.id); saveCreator(); closeSheet(); render(); };
  });
}

/* =====================================================================
   [V9] 시계 앱 — 알람(시간 알림)
   ===================================================================== */
const allAlarms = () => (creator.alarms || []).map(a => ({ ...a, src: "creator", on: user.alarmOn[a.id] ?? a.on })).concat(user.alarms.map(a => ({ ...a, src: "user" })));
const fmtAl = t => { let [h, m] = t.split(":").map(Number); return `<span>${h % 12 || 12}:${pad(m)}</span><small>${h < 12 ? "오전" : "오후"}</small>`; };
function renderClock(){
  const al = allAlarms().sort((a, b) => a.time.localeCompare(b.time)), d = new Date();
  $("app").insertAdjacentHTML("beforeend", `
    <div class="appbar"><h1>알람</h1><button class="link" id="alAdd">추가</button></div>
    <div class="scroll"><div class="clkhead"><div class="bigt" id="hTime"></div><div class="dt" id="hDate"></div></div>
    <div class="list">${al.map(a => `<div class="alrow ${a.on ? "" : "off"}" data-id="${a.id}" data-s="${a.src}"><button class="am"><div class="at">${fmtAl(a.time)}</div><div class="al">${esc(a.label || "알람")}${a.src === "creator" ? " · " + esc(ownerName()) : ""}</div></button><button class="sw ${a.on ? "on" : ""}" aria-label="알람 켜기/끄기"></button></div>`).join("") || `<div class="empty">알람이 없습니다</div>`}</div>
    <p class="hint" style="padding:6px 20px">설정한 시각이 되면 소리와 함께 알림이 울립니다. (화면이 열려 있는 동안 작동)</p></div>`);
  tick();
  $("alAdd").onclick = () => alarmSheet();
  $("app").querySelectorAll(".alrow").forEach(r => {
    const a = al.find(x => x.id === r.dataset.id);
    r.querySelector(".sw").onclick = () => { if(a.src === "creator") user.alarmOn[a.id] = !a.on; else user.alarms.find(x => x.id === a.id).on = !a.on; saveUser(); render(); };
    r.querySelector(".am").onclick = () => { if(a.src === "user" || isCreator()) alarmSheet(a); };
  });
}
EXTRA.clock = renderClock;
function alarmSheet(a){
  const src = a ? a.src : (isCreator() ? "creator" : "user");
  openSheet(`<h3>${a ? "알람 편집" : "알람 추가"}${src === "creator" ? " (제작자)" : ""}</h3>
    <div class="field"><label>시간</label><input type="time" id="fTm" value="${a ? a.time : "07:00"}"></div>
    <div class="field"><label>이름</label><input id="fLb" value="${esc(a ? a.label : "")}" placeholder="알람"></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>${a ? `<div class="btns"><button class="btn red" id="fDel">삭제</button></div>` : ""}`, () => {
    const arr = src === "creator" ? creator.alarms : user.alarms, done = () => { src === "creator" ? saveCreator() : saveUser(); closeSheet(); render(); };
    $("fSave").onclick = () => { const time = $("fTm").value; if(!time) return; const d = { time, label: $("fLb").value.trim() };
      if(a){ Object.assign(arr.find(x => x.id === a.id), d); } else arr.push({ id: uid("al"), on: true, ...d }); done(); };
    if($("fDel")) $("fDel").onclick = () => { arr.splice(arr.findIndex(x => x.id === a.id), 1); done(); };
  });
}
// 알람 울림
let alarmActive = null, alarmT = null, lastAlarmKey = "", snoozes = [];
function beepAlarm(){ if(user.sound && audio()){ [0, .22, .44, .66].forEach(t => tone(1568, t, .16, .22, "square")); } vibe([300, 150, 300]); }
function startAlarm(a){
  alarmActive = a; const el = $("alarm");
  el.innerHTML = `<div><div class="ai">⏰</div><h2>${nowTime()}</h2><p>${esc(a.label || "알람")}</p></div><div class="bt"><button id="alSnz">다시 알림 (5분 뒤)</button><button class="stop" id="alStop">중지</button></div>`;
  el.classList.add("open"); beepAlarm(); alarmT = setInterval(beepAlarm, 1800);
  $("alStop").onclick = stopAlarm;
  $("alSnz").onclick = () => { const d = new Date(Date.now() + 5 * 60000); snoozes.push({ id: uid("sz"), time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, label: a.label, on: true, snooze: true }); stopAlarm(); toast("5분 뒤에 다시 알려 드립니다"); };
}
function stopAlarm(){ clearInterval(alarmT); alarmT = null; alarmActive = null; $("alarm").classList.remove("open"); navigator.vibrate && navigator.vibrate(0); }
setInterval(() => {
  if(alarmActive) return;
  const t = nowTime(), key = todayStr() + t; if(key === lastAlarmKey) return;
  const hit = allAlarms().concat(snoozes).find(a => a.on && a.time === t);
  if(hit){ lastAlarmKey = key; snoozes = snoozes.filter(x => x !== hit); startAlarm(hit); }
}, 1000);

/* =====================================================================
   [V8] 테마 / 버튼음 / 선택지 / 답장·전화 반응 / 이벤트 편집 화면
   ===================================================================== */
function applyTheme(){ document.body.classList.toggle("dark", user.theme === "dark"); }

// 버튼을 누를 때 나는 "띵" 소리
function sndSheet(){
  const c = snd(), opt = (list, cur) => list.map(([v, n]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${n}</option>`).join("");
  openSheet(`<h3>소리 및 진동</h3>
    <div class="field"><label>소리 전체</label><div class="seg" id="qOn"><button data-v="1" class="${user.sound ? "on" : ""}">켜짐</button><button data-v="0" class="${!user.sound ? "on" : ""}">꺼짐</button></div></div>
    <div class="field"><label>음량 <b id="qVv">${c.vol}</b>%</label><input type="range" id="qVol" min="10" max="100" step="5" value="${c.vol}"></div>
    <div class="field"><label>전화 벨소리</label><select id="qRing">${opt([["auto","자동 (라이트: 기본 / 다크: 긴장감)"],["basic","기본 멜로디"],["marimba","마림바"],["classic","옛날 전화 벨"],["tense","긴장감"],["off","무음"]], c.ring)}</select></div>
    <div class="field"><label>문자 알림음</label><select id="qMsg">${opt([["ding","띠롱"],["chime","차임"],["bubble","버블"],["knock","노크"],["off","무음"]], c.msg)}</select></div>
    <div class="field"><label>화면 터치음</label><select id="qTouch">${opt([["ting","띵"],["tock","톡"],["pop","팝"],["off","끔"]], c.touch)}</select></div>
    <div class="field"><label>진동</label><div class="seg" id="qVib"><button data-v="1" class="${c.vib ? "on" : ""}">켜짐</button><button data-v="0" class="${!c.vib ? "on" : ""}">꺼짐</button></div></div>
    <p class="hint">바꾸면 바로 들려드립니다. 모드(라이트/다크)와 관계없이 이 폰에 저장됩니다.</p>
    <div class="btns"><button class="btn" onclick="closeSheet();render()">닫기</button></div>`, () => {
    const set = (k, v) => { user.snd = Object.assign({}, user.snd || {}, { [k]: v }); saveUser(); };
    $("qOn").querySelectorAll("button").forEach(b => b.onclick = () => { user.sound = b.dataset.v === "1"; saveUser(); $("qOn").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); if(user.sound) ding(); });
    $("qVib").querySelectorAll("button").forEach(b => b.onclick = () => { set("vib", b.dataset.v === "1"); $("qVib").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); vibe(200); });
    $("qVol").oninput = e => { set("vol", +e.target.value); $("qVv").textContent = e.target.value; };
    $("qVol").onchange = () => ding();
    $("qRing").onchange = e => { set("ring", e.target.value); ringStop(); ringStart(); setTimeout(() => { if(!callActive) ringStop(); }, 2800); };
    $("qMsg").onchange = e => { set("msg", e.target.value); ding(); };
    $("qTouch").onchange = e => { set("touch", e.target.value); click(); };
  });
}
function click(){
  if(!(user.sound && audio())) return; const k = snd().touch;
  if(k === "ting") tone(1175, 0, .12, .09);
  else if(k === "tock"){ const n = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = "sine"; o.frequency.setValueAtTime(560, n); o.frequency.exponentialRampToValueAtTime(200, n + .04); g.gain.setValueAtTime(.2, n); g.gain.exponentialRampToValueAtTime(.001, n + .06); o.connect(g); g.connect(outNode()); o.start(n); o.stop(n + .07); }
  else if(k === "pop") tone(880, 0, .05, .12, "triangle");
}
document.addEventListener("pointerdown", e => { if(e.target.closest && e.target.closest("button, label.link, .tile")) click(); });

// 상대방 반응: 문자(여러 줄 가능) 후 전화. 키워드 반응과 선택지가 함께 사용
function respond(cid, r){
  let t = (r.delay ?? 2) * 1000;
  const texts = Array.isArray(r.reply) ? r.reply : (r.reply ? String(r.reply).split("\n").filter(Boolean) : []);
  texts.forEach((x, i) => setTimeout(() => deliver(cid, x), t + i * 1500));
  t += texts.length * 1500;
  if(r.call) setTimeout(() => startCall({ contact: r.callFrom || cid, lines: r.call.lines || [], ring: r.call.ring || 20 }), t + 500);
}

// 선택지
function visibleChoices(c){
  const th = user.theme === "dark" ? "dark" : "light";
  return (c.choices || []).filter(x => isCreator() || !(user.used || []).includes(x.id));
}
function choiceStrip(c){
  if(c.src !== "creator") return "";
  const v = visibleChoices(c);
  if(!v.length && !isCreator()) return "";
  return `<div class="choices">${v.map(x => `<button class="chip ${isCreator() ? "editable" : ""}" data-cid="${x.id}">${esc(x.text)}</button>`).join("")}${isCreator() ? `<button class="chip add" data-add="1">＋ 선택지</button>` : ""}</div>`;
}
function useChoice(cid, ch){
  if(!ch) return;
  (user.messages[cid] = user.messages[cid] || []).push({ id: uid("um"), from: "me", date: todayStr(), time: nowTime(), text: ch.text });
  (user.used = user.used || []).push(ch.id);
  saveUser(); render(); respond(cid, ch);
}

// 반응(답장·지연·전화) 입력칸 — 선택지와 키워드 반응이 같이 씀
function reactHtml(r){
  r = r || {};
  return `<div class="field"><label>상대방 답장 (줄바꿈으로 여러 개, 비우면 답장 없음)</label><textarea id="fRep">${esc(Array.isArray(r.reply) ? r.reply.join("\n") : (r.reply || ""))}</textarea></div>
    <div class="field"><label>답장·전화가 오기까지 (초)</label><input type="number" id="fDelay" min="0" value="${r.delay ?? 2}"></div>
    <div class="field"><label>전화도 걸려오게 하기</label><select id="fCallOn"><option value="0">아니오</option><option value="1" ${r.call ? "selected" : ""}>예</option></select></div>
    <div class="field"><label>통화 대사 (줄바꿈으로 구분, 3초 간격)</label><textarea id="fLines">${esc((r.call && r.call.lines || []).join("\n"))}</textarea></div>`;

function readReact(){
  const list = id => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);

  if($("fCallOn").value === "1") o.call = { lines: list("fLines"), ring: 20 };
  return o;
}
function segBind(id, init, cb){
  let v = init; $(id).querySelectorAll("button").forEach(b => b.onclick = () => { v = b.dataset.v; $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); cb && cb(v); });

}

      <div class="btns" style="margin:8px 16px"><button class="btn" id="ruAdd">키워드 반응 추가</button></div>
      <p class="hint" style="padding:0 20px">선택지(눌러서 보내는 문자)는 대화방에서 '＋ 선택지'로 추가합니다.</p>
    </div>`);
  $("evBack").onclick = back;
  $("evAdd").onclick = () => eventSheet(); $("ruAdd").onclick = () => ruleSheet();
  $("app").querySelectorAll("[data-ev]").forEach(r => r.onclick = () => eventSheet(creator.events.find(x => x.id === r.dataset.ev)));
  $("app").querySelectorAll("[data-ru]").forEach(r => r.onclick = () => ruleSheet(+r.dataset.ru));
}
function eventSheet(e){
  if(!creator.contacts.length){ toast("먼저 대화 상대를 추가하세요"); return; }
  const t0 = e ? e.type : "message";
  openSheet(`<h3>${e ? "이벤트 편집" : "이벤트 추가"}</h3>
    <div class="field"><label>종류</label><div class="seg" id="fType"><button data-v="message" class="${t0 === "message" ? "on" : ""}">문자</button><button data-v="call" class="${t0 === "call" ? "on" : ""}">전화</button></div></div>
    <div class="field"><label>보내는 사람</label><select id="fC">${contactOptions(e && e.contact)}</select></div>
    <div class="field"><label>잠금을 푼 뒤 몇 초에 올까요?</label><input type="number" id="fAt" min="0" value="${e ? e.at : 30}"></div>
    <div class="field"><label>문자 내용 / 통화 대사 (전화는 줄바꿈으로 구분, 3초 간격)</label><textarea id="fTx">${esc(e ? (e.type === "call" ? (e.lines || []).join("\n") : e.text) : "")}</textarea></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>
    ${e ? `<div class="btns"><button class="btn red" id="fDel">삭제</button></div>` : ""}`, () => {
    const type = segBind("fType", t0);
    $("fSave").onclick = () => {
      const tx = $("fTx").value.trim(); if(!tx){ toast("내용을 입력하세요"); return; }
      const d = { type: type(), contact: $("fC").value, at: Math.max(0, +$("fAt").value || 0) };
      if(d.type === "call"){ d.lines = tx.split("\n").map(x => x.trim()).filter(Boolean); d.ring = 20; } else d.text = tx;
      if(e){ const i = creator.events.findIndex(x => x.id === e.id); creator.events[i] = { id: e.id, ...d }; } else creator.events.push({ id: uid("e"), ...d });
      saveCreator(); closeSheet(); render();
    };
    if($("fDel")) $("fDel").onclick = () => { creator.events = creator.events.filter(x => x.id !== e.id); saveCreator(); closeSheet(); render(); };
  });
}
function ruleSheet(i){
  const r = i != null ? creator.autoReplies[i] : null;
  openSheet(`<h3>${r ? "키워드 반응 편집" : "키워드 반응 추가"}</h3>
    <div class="field"><label>어느 대화방에서?</label><select id="fC">${contactOptions(r ? r.contact : "*", true)}</select></div>
    <div class="field"><label>키워드 (쉼표로 구분, 하나라도 들어 있으면 작동)</label><input id="fK" value="${esc(r ? (r.keywords || []).join(", ") : "")}"></div>
    ${reactHtml(r)}
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>
    ${r ? `<div class="btns"><button class="btn red" id="fDel">삭제</button></div>` : ""}`, () => {
    $("fSave").onclick = () => {
      const kw = $("fK").value.split(",").map(x => x.trim()).filter(Boolean);
      if(!kw.length){ toast("키워드를 입력하세요"); return; }
      const d = { contact: $("fC").value, keywords: kw, ...readReact() };
      if(!d.reply.length && !d.call){ toast("답장이나 전화 중 하나는 필요합니다"); return; }
      if(r) creator.autoReplies[i] = d; else creator.autoReplies.push(d);
      saveCreator(); closeSheet(); render();
    };
    if($("fDel")) $("fDel").onclick = () => { creator.autoReplies.splice(i, 1); saveCreator(); closeSheet(); render(); };
  });
}

/* =====================================================================
   [V9] 인터넷 앱 — 제작자가 만든 페이지/즐겨찾기/검색기록
   ===================================================================== */
let webS = { view: "home", q: "", page: null };
function webHost(u){ return String(u || "").replace(/^https?:\/\//, "").replace(/^www\./, ""); }
function webFind(q){ q = q.trim().toLowerCase(); if(!q) return []; const h = webHost(q); return creator.web.pages.filter(p => webHost(p.url).toLowerCase().includes(h) || (p.title || "").toLowerCase().includes(q) || (p.body || "").toLowerCase().includes(q)); }
function renderWeb(){
  const w = creator.web, hist = w.history.concat(user.webq.slice().reverse()).filter((x, i, a) => a.indexOf(x) === i);
  let body = "";
  if(webS.view === "page"){
    const pg = w.pages.find(x => x.id === webS.page);
    body = pg ? `<div class="wpage"><h1>${esc(pg.title)}</h1><div class="wu">${esc(pg.url)}</div>${esc(pg.body)}</div>${isCreator() ? `<div class="btns" style="margin:8px 16px"><button class="btn" id="wEdit">이 페이지 편집</button></div>` : ""}` : `<div class="empty">페이지를 찾을 수 없습니다</div>`;
  } else if(webS.view === "results"){
    const r = webFind(webS.q);
    body = `<div class="section-title">‘${esc(webS.q)}’ 검색 결과</div><div class="list">${r.map(x => `<button class="row" data-p="${x.id}"><div class="main"><div class="name"><span>${esc(x.title)}</span></div><div class="prev">${esc(x.url)}</div></div></button>`).join("") || `<div class="empty">검색 결과가 없습니다</div>`}</div>`;
  } else {
    body = `<div class="section-title">즐겨찾기</div><div class="favs">${w.bookmarks.map((b, i) => `<button data-b="${i}"><span class="fi">${esc((b.title || "?").slice(0, 1))}</span>${esc(b.title)}</button>`).join("")}</div>
      <div class="section-title">최근 검색</div><div class="list">${hist.map(h => `<button class="row" data-h="${esc(h)}"><div class="main">🕘 ${esc(h)}</div></button>`).join("") || `<div class="empty">검색 기록이 없습니다</div>`}</div>
      ${isCreator() ? `<div class="btns" style="margin:10px 16px"><button class="btn" id="wAdd">페이지 추가</button><button class="btn gray" id="wFav">즐겨찾기·검색기록 편집</button></div>` : ""}`;
  }
  $("app").insertAdjacentHTML("beforeend", `<div class="wbar"><button id="wHome">${webS.view === "home" ? "🧭" : "‹"}</button><input id="wQ" placeholder="검색 또는 웹사이트 주소 입력" value="${esc(webS.view === "page" ? (w.pages.find(x => x.id === webS.page) || {}).url || "" : webS.q)}"></div><div class="scroll">${body}</div>`);
  const go2 = (view, extra) => { webS = { ...webS, view, ...extra }; render(); };
  $("wHome").onclick = () => webS.view === "page" && webS.q ? go2("results") : go2("home", { q: "" });
  $("wQ").onkeydown = e => { if(e.key === "Enter"){ const q = $("wQ").value.trim(); if(!q) return; if(!user.webq.includes(q)){ user.webq.push(q); saveUser(); } const exact = w.pages.find(x => webHost(x.url).toLowerCase() === webHost(q).toLowerCase()); if(exact) go2("page", { page: exact.id, q }); else go2("results", { q }); } };
  $("app").querySelectorAll("[data-p]").forEach(b => b.onclick = () => go2("page", { page: b.dataset.p }));
  $("app").querySelectorAll("[data-h]").forEach(b => b.onclick = () => go2("results", { q: b.dataset.h }));
  $("app").querySelectorAll("[data-b]").forEach(b => b.onclick = () => { const bk = w.bookmarks[+b.dataset.b], pg = webFind(bk.url)[0]; if(pg) go2("page", { page: pg.id, q: bk.title }); else go2("results", { q: bk.title }); });
  if($("wAdd")) $("wAdd").onclick = () => webSheet(); if($("wEdit")) $("wEdit").onclick = () => webSheet(w.pages.find(x => x.id === webS.page));
  if($("wFav")) $("wFav").onclick = webListSheet;
}
EXTRA.web = renderWeb;
function webSheet(pg){
  openSheet(`<h3>${pg ? "페이지 편집" : "페이지 추가"}</h3>
    <div class="field"><label>주소</label><input id="fU" value="${esc(pg?.url || "")}" placeholder="news.example.com/123"></div>
    <div class="field"><label>제목</label><input id="fT" value="${esc(pg?.title || "")}"></div>
    <div class="field"><label>본문</label><textarea id="fB" style="min-height:200px">${esc(pg?.body || "")}</textarea></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>${pg ? `<div class="btns"><button class="btn red" id="fDel">삭제</button></div>` : ""}`, () => {
    $("fSave").onclick = () => { const d = { url: $("fU").value.trim(), title: $("fT").value.trim(), body: $("fB").value }; if(!d.url || !d.title){ toast("주소와 제목을 입력하세요"); return; }
      if(pg) Object.assign(pg, d); else { const n = { id: uid("w"), ...d }; creator.web.pages.push(n); webS = { ...webS, view: "page", page: n.id }; }
      saveCreator(); closeSheet(); render(); };
    if($("fDel")) $("fDel").onclick = () => { creator.web.pages = creator.web.pages.filter(x => x.id !== pg.id); webS = { view: "home", q: "", page: null }; saveCreator(); closeSheet(); render(); };
  });
}
function webListSheet(){
  const w = creator.web;
  openSheet(`<h3>즐겨찾기 · 검색기록</h3>
    <div class="field"><label>즐겨찾기 (한 줄에 하나: 이름 | 주소)</label><textarea id="fBk" style="min-height:110px">${esc(w.bookmarks.map(b => b.title + " | " + b.url).join("\n"))}</textarea></div>
    <div class="field"><label>최근 검색어 (한 줄에 하나)</label><textarea id="fHi" style="min-height:110px">${esc(w.history.join("\n"))}</textarea></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>`, () => {
    $("fSave").onclick = () => {
      w.bookmarks = $("fBk").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => { const [t, u] = l.split("|").map(x => x.trim()); return { title: t, url: u || t }; });
      w.history = $("fHi").value.split("\n").map(l => l.trim()).filter(Boolean); saveCreator(); closeSheet(); render(); };
  });
}

/* =====================================================================
   [V9] 캠퍼스 커뮤니티 앱 — 게시판 / 글 / 댓글 (제작자가 글·댓글 작성)
   ===================================================================== */
let cmS = { view: "boards", board: null, post: null };
const cmCmts = p => p.comments.map(c => ({ ...c, mine: false })).concat((user.ccomments[p.id] || []).map(c => ({ ...c, mine: true })));
function renderCampus(){
  const c = creator.campus;
  if(cmS.view === "boards"){
    $("app").insertAdjacentHTML("beforeend", `<div class="cmhead"><div class="row1"><h1>${esc(c.name)}</h1><small>${esc(ownerName())}</small></div></div>
      <div class="scroll"><div class="section-title">게시판</div><div class="boards">${c.boards.map(b => `<button class="row" data-b="${b.id}"><div class="main"><b>${esc(b.name)}</b></div><span class="prev">${c.posts.filter(p => p.board === b.id).length}</span></button>`).join("")}</div>
      <div class="section-title">최신 글</div>${c.posts.slice().sort((a, b) => stamp(b) - stamp(a)).slice(0, 8).map(postRow).join("") || `<div class="empty">글이 없습니다</div>`}
      ${isCreator() ? `<div class="btns" style="margin:10px 16px"><button class="btn gray" id="cbAdd">게시판 추가</button></div>` : ""}</div>${isCreator() ? `<button class="wr" id="cmWrite">✎</button>` : ""}`);
    $("app").querySelectorAll("[data-b]").forEach(b => b.onclick = () => { cmS = { view: "board", board: b.dataset.b, post: null }; render(); });
    if($("cbAdd")) $("cbAdd").onclick = boardSheet;
  } else if(cmS.view === "board"){
    const bd = c.boards.find(b => b.id === cmS.board) || { name: "" }, ps = c.posts.filter(p => p.board === cmS.board).sort((a, b) => stamp(b) - stamp(a));
    $("app").insertAdjacentHTML("beforeend", `<div class="cmhead"><div class="row1"><button class="link" id="cmBack">‹ 게시판</button><h1 style="font-size:17px;color:#222">${esc(bd.name)}</h1>${isCreator() ? `<button class="link" id="cbEdit">편집</button>` : "<span style='width:40px'></span>"}</div></div>
      <div class="scroll">${ps.map(postRow).join("") || `<div class="empty">글이 없습니다</div>`}</div>${isCreator() ? `<button class="wr" id="cmWrite">✎</button>` : ""}`);
    $("cmBack").onclick = () => { cmS = { view: "boards" }; render(); };
    if($("cbEdit")) $("cbEdit").onclick = () => boardSheet(bd);
  } else {
    const p = c.posts.find(x => x.id === cmS.post); if(!p){ cmS = { view: "boards" }; render(); return; }
    const cs = cmCmts(p);
    $("app").insertAdjacentHTML("beforeend", `<div class="cmhead"><div class="row1"><button class="link" id="cmBack">‹ 목록</button><h1 style="font-size:17px;color:#222">${esc((c.boards.find(b => b.id === p.board) || {}).name || "")}</h1>${isCreator() ? `<button class="link" id="pEdit">편집</button>` : "<span style='width:40px'></span>"}</div></div>
      <div class="scroll"><div class="pview"><div class="au"><div class="pa">👤</div><div><div class="an">${esc(p.author || "익명")}</div><div class="ad">${esc(p.date ? p.date.slice(5).replace("-", "/") : "")} ${esc(p.time || "")}</div></div></div>
      <h2>${esc(p.title)}</h2><div class="pbody2">${esc(p.body)}</div>
      <div class="stat"><span class="a">👍 ${p.likes || 0}</span><span class="b">💬 ${cs.length}</span><span class="c">☆ 0</span></div></div>
      ${cs.map(k => `<div class="cmt ${k.re ? "re" : ""}" data-k="${k.id}"><div class="cu"><b class="${k.author === "글쓴이" ? "w" : ""}">${esc(k.author || "익명")}</b><small>${esc(k.time || "")}</small></div><div class="ct">${esc(k.text)}</div></div>`).join("")}
      ${isCreator() ? `<div class="btns" style="margin:10px 16px"><button class="btn gray" id="cmAdd">댓글 작성 (제작자)</button></div>` : ""}</div>
      <div class="cmtbar"><input id="cmIn" placeholder="댓글을 입력하세요."><button id="cmSend">➤</button></div>`);
    $("cmBack").onclick = () => { cmS = { view: "board", board: p.board }; render(); };
    if($("pEdit")) $("pEdit").onclick = () => postSheet(p);
    if($("cmAdd")) $("cmAdd").onclick = () => cmtSheet(p);
    $("cmSend").onclick = () => { const t = $("cmIn").value.trim(); if(!t) return; (user.ccomments[p.id] = user.ccomments[p.id] || []).push({ id: uid("uk"), author: "익명", text: t, time: nowTime() }); saveUser(); render(); };
    if(isCreator()) $("app").querySelectorAll(".cmt").forEach(e => e.onclick = () => { const k = p.comments.find(x => x.id === e.dataset.k); if(k) cmtSheet(p, k); });
  }
  if($("cmWrite")) $("cmWrite").onclick = () => postSheet(null, cmS.board);
  $("app").querySelectorAll("[data-pid]").forEach(b => b.onclick = () => { cmS = { view: "post", post: b.dataset.pid, board: cmS.board }; render(); });
}
EXTRA.campus = renderCampus;
function postRow(p){
  const n = p.comments.length + (user.ccomments[p.id] || []).length;
  return `<button class="post" data-pid="${p.id}"><div class="pt">${esc(p.title)}</div><div class="pb">${esc(p.body)}</div><div class="pm"><span>${esc(p.date ? p.date.slice(5).replace("-", "/") : "")} ${esc(p.time || "")}</span><span>${esc(p.author || "익명")}</span><span class="lk">👍 ${p.likes || 0}</span><span class="cm">💬 ${n}</span></div></button>`;
}
function boardSheet(bd){
  openSheet(`<h3>${bd ? "게시판 편집" : "게시판 추가"}</h3><div class="field"><label>이름</label><input id="fN" value="${esc(bd?.name || "")}"></div>
    <div class="btns"><button class="btn gray" onclick="closeSheet()">취소</button><button class="btn" id="fSave">저장</button></div>${bd ? `<div class="btns"><button class="btn red" id="fDel">게시판과 글 삭제</button></div>` : ""}`, () => {
    $("fSave").onclick = () => { const name = $("fN").value.trim(); if(!name) return; if(bd) bd.name = name; else creator.campus.boards.push({ id: uid("b"), name }); saveCreator(); closeSheet(); render(); };
    if($("fDel")) $("fDel").onclick = () => { if(!confirm("게시판과 안의 글을 모두 삭제할까요?")) return; creator.campus.boards = creator.campus.boards.filter(b => b.id !== bd.id); creator.campus.posts = creator.campus.posts.filter(p => p.board !== bd.id); cmS = { view: "boards" }; saveCreator(); closeSheet(); render(); };
  });
}

    <div class="field"><label>게시판</label><select id="fBd">${c.boards.map(b => `<option value="${b.id}" ${(p ? p.board : board) === b.id ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></div>

function cmtSheet(p, k){
  openSheet(`<h3>${k ? "댓글 편집" : "댓글 작성"}</h3>
    <div class="field"><label>작성자 (익명 / 글쓴이 / 직접 입력)</label><input id="fAu" value="${esc(k ? k.author : "익명")}"></div>

    $("fSave").onclick = () => { const d = { author: $("fAu").value.trim() || "익명", text: $("fB").value.trim(), time: $("fTm").value, re: $("fRe").value === "1" }; if(!d.text) return;
